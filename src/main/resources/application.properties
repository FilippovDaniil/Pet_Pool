# Database - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/billiard_club
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Spring MVC hidden method filter (for PUT/DELETE in forms)
spring.mvc.hiddenmethod.filter.enabled=true

# Server
server.port=7070

# OpenSearch
# Variant B: one URL instead of host+port+scheme.
# Spring converts env var OPENSEARCH_URL -> opensearch.url automatically.
# Use opensearch.enabled=false in tests to skip bean creation entirely.
opensearch.enabled=true
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}

# Actuator — health endpoint for K8s probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# Logging
logging.level.com.billiardclub=INFO
logging.level.org.springframework.security=WARN
