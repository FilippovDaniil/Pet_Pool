<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Стол — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <h1 class="h3 fw-bold mb-4">
            <i class="bi bi-grid-3x3 me-2 text-warning"></i>
            <span th:text="${table.id != null} ? 'Редактировать стол' : 'Добавить стол'">Стол</span>
        </h1>

        <div class="card shadow-sm border-0" style="max-width:480px">
            <div class="card-body">
                <!-- Create form -->
                <form th:if="${table.id == null}" th:action="@{/tables}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Номер стола</label>
                        <input type="number" name="number" class="form-control"
                               th:value="${table.number}" min="1" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Тип</label>
                        <select name="type" class="form-select" required>
                            <option th:each="t : ${tableTypes}"
                                    th:value="${t.name()}"
                                    th:text="${t.displayName}"
                                    th:selected="${table.type == t}">
                            </option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-1"></i>Сохранить
                        </button>
                        <a th:href="@{/tables}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>

                <!-- Edit form -->
                <form th:if="${table.id != null}"
                      th:action="@{/tables/{id}(id=${table.id})}" method="post">
                    <input type="hidden" name="_method" value="put"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Номер стола</label>
                        <input type="number" name="number" class="form-control"
                               th:value="${table.number}" min="1" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Тип</label>
                        <select name="type" class="form-select" required>
                            <option th:each="t : ${tableTypes}"
                                    th:value="${t.name()}"
                                    th:text="${t.displayName}"
                                    th:selected="${table.type == t}">
                            </option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-1"></i>Сохранить
                        </button>
                        <a th:href="@{/tables}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
