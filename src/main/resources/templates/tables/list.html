<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Столы — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">
                <i class="bi bi-grid-3x3 me-2 text-warning"></i>Столы
            </h1>
            <a th:href="@{/tables/add}" sec:authorize="hasRole('ADMIN')"
               class="btn btn-warning">
                <i class="bi bi-plus-lg me-1"></i>Добавить стол
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>№ стола</th>
                            <th>Тип</th>
                            <th>Цена/час</th>
                            <th>Статус</th>
                            <th sec:authorize="hasRole('ADMIN')" class="text-end">Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="table : ${tables}">
                            <td class="fw-semibold">№<span th:text="${table.number}"></span></td>
                            <td>
                                <span th:text="${table.type.displayName}"
                                      th:class="${table.type.name() == 'RUSSIAN'} ? 'badge bg-primary' : 'badge bg-info'">
                                </span>
                            </td>
                            <td th:text="${table.pricePerHour} + ' руб/час'"></td>
                            <td>
                                <span th:if="${availability[table.id]}" class="badge bg-success">
                                    <i class="bi bi-check-circle me-1"></i>Свободен
                                </span>
                                <span th:unless="${availability[table.id]}" class="badge bg-danger">
                                    <i class="bi bi-x-circle me-1"></i>Занят
                                </span>
                            </td>
                            <td sec:authorize="hasRole('ADMIN')" class="text-end">
                                <a th:href="@{/tables/{id}/edit(id=${table.id})}"
                                   class="btn btn-sm btn-outline-secondary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/tables/{id}(id=${table.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Удалить стол №' + this.dataset.num + '?')"
                                      th:data-num="${table.number}">
                                    <input type="hidden" name="_method" value="delete"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${tables.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-4">Столы не найдены</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
