<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Турнирная доска — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <h1 class="h3 fw-bold mb-4">
            <i class="bi bi-trophy me-2 text-warning"></i>Турнирная доска
        </h1>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Дата и время</th>
                            <th>Стол</th>
                            <th><i class="bi bi-trophy-fill text-warning me-1"></i>Победитель</th>
                            <th>Проигравший</th>
                            <th sec:authorize="hasRole('ADMIN')" class="text-end">Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r, stat : ${records}">
                            <td class="text-muted small" th:text="${stat.index + 1}"></td>
                            <td class="small" th:text="${#temporals.format(r.gameDate, 'dd.MM.yyyy HH:mm')}"></td>
                            <td><span class="badge bg-secondary">№<span th:text="${r.tableNumber}"></span></span></td>
                            <td>
                                <i class="bi bi-trophy-fill text-warning me-1"></i>
                                <strong th:text="${r.winnerName}"></strong>
                            </td>
                            <td class="text-muted" th:text="${r.loserName}"></td>
                            <td sec:authorize="hasRole('ADMIN')" class="text-end">
                                <!-- Edit: GET /tournament/{id}/edit (fixed path, no /record/) -->
                                <a th:href="@{/tournament/{id}/edit(id=${r.id})}"
                                   class="btn btn-sm btn-outline-secondary me-1" title="Редактировать">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- Delete: DELETE /api/tournament/{id} via fetch() -->
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        th:onclick="|deleteTournamentRecord(${r.id})|"
                                        title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${records.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-trophy fs-1 d-block mb-2 text-muted"></i>
                                Нет завершённых игр
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/api.js}"></script>
</body>
</html>
