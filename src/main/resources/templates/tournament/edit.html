<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Редактировать запись — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <h1 class="h3 fw-bold mb-4">
            <i class="bi bi-pencil me-2 text-warning"></i>Редактировать запись турнира
        </h1>

        <div class="card shadow-sm border-0" style="max-width:480px">
            <div class="card-body">
                <div class="mb-3 text-muted small">
                    Стол №<strong th:text="${record.tableNumber}"></strong> &nbsp;|&nbsp;
                    <span th:text="${#temporals.format(record.gameDate, 'dd.MM.yyyy HH:mm')}"></span>
                </div>

                <form th:action="@{/tournament/record/{id}(id=${record.id})}" method="post">
                    <input type="hidden" name="_method" value="put"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-trophy-fill text-warning me-1"></i>Победитель
                        </label>
                        <input type="text" name="winnerName" class="form-control"
                               th:value="${record.winnerName}" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Проигравший</label>
                        <input type="text" name="loserName" class="form-control"
                               th:value="${record.loserName}" required/>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-1"></i>Сохранить
                        </button>
                        <a th:href="@{/tournament}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
