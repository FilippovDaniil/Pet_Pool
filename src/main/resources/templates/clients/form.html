<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Клиент — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <h1 class="h3 fw-bold mb-4">
            <i class="bi bi-person me-2 text-warning"></i>
            <span th:text="${client.id != null} ? 'Редактировать клиента' : 'Добавить клиента'">Клиент</span>
        </h1>

        <div class="card shadow-sm border-0" style="max-width:520px">
            <div class="card-body">
                <!-- Create form (admin only) -->
                <form th:if="${client.id == null}" th:action="@{/clients}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">ФИО <span class="text-danger">*</span></label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${client.fullName}" required placeholder="Иванов Иван Иванович"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Разряд</label>
                        <select name="rank" class="form-select">
                            <option value="">Не указан</option>
                            <option th:each="r : ${ranks}" th:value="${r}" th:text="${r}"
                                    th:selected="${client.rank == r}"></option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Телефон</label>
                        <input type="text" name="phone" class="form-control"
                               th:value="${client.phone}" placeholder="+7-900-000-0000"/>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-1"></i>Сохранить
                        </button>
                        <a th:href="@{/clients}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>

                <!-- Edit form -->
                <form th:if="${client.id != null}"
                      th:action="@{/clients/{id}(id=${client.id})}" method="post">
                    <input type="hidden" name="_method" value="put"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">ФИО <span class="text-danger">*</span></label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${client.fullName}" required/>
                    </div>
                    <!-- Rank visible only to Admin -->
                    <div class="mb-3" sec:authorize="hasRole('ADMIN')">
                        <label class="form-label fw-semibold">Разряд</label>
                        <select name="rank" class="form-select">
                            <option value="">Не указан</option>
                            <option th:each="r : ${ranks}" th:value="${r}" th:text="${r}"
                                    th:selected="${client.rank == r}"></option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Телефон</label>
                        <input type="text" name="phone" class="form-control" th:value="${client.phone}"/>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-1"></i>Сохранить
                        </button>
                        <a th:href="@{/clients}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
