<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Дашборд — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light">
        <h1 class="h3 mb-4 fw-bold">
            <i class="bi bi-speedometer2 me-2 text-warning"></i>Дашборд
        </h1>

        <!-- Stats cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-warning bg-opacity-10 p-3">
                            <i class="bi bi-grid-3x3 fs-2 text-warning"></i>
                        </div>
                        <div>
                            <div class="fs-2 fw-bold" th:text="${totalTables}">18</div>
                            <div class="text-muted">Всего столов</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-primary bg-opacity-10 p-3">
                            <i class="bi bi-people fs-2 text-primary"></i>
                        </div>
                        <div>
                            <div class="fs-2 fw-bold" th:text="${totalClients}">0</div>
                            <div class="text-muted">Клиентов</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-success bg-opacity-10 p-3">
                            <i class="bi bi-play-circle fs-2 text-success"></i>
                        </div>
                        <div>
                            <div class="fs-2 fw-bold" th:text="${activeBookings}">0</div>
                            <div class="text-muted">Активных игр</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick links -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <a th:href="@{/bookings/new}" class="card text-decoration-none shadow-sm border-0 h-100 text-dark">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-plus-circle fs-1 text-warning mb-2 d-block"></i>
                        <div class="fw-semibold">Новое бронирование</div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/bookings}" class="card text-decoration-none shadow-sm border-0 h-100 text-dark">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-calendar-check fs-1 text-primary mb-2 d-block"></i>
                        <div class="fw-semibold">Бронирования</div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/clients}" class="card text-decoration-none shadow-sm border-0 h-100 text-dark">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-people fs-1 text-info mb-2 d-block"></i>
                        <div class="fw-semibold">Клиенты</div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/tournament}" class="card text-decoration-none shadow-sm border-0 h-100 text-dark">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-trophy fs-1 text-success mb-2 d-block"></i>
                        <div class="fw-semibold">Турнирная доска</div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Recent tournament records -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-semibold">
                <i class="bi bi-trophy me-2 text-warning"></i>Последние результаты
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0" th:if="${!recentRecords.isEmpty()}">
                    <thead class="table-light">
                        <tr>
                            <th>Дата</th>
                            <th>Стол</th>
                            <th>Победитель</th>
                            <th>Проигравший</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${recentRecords}">
                            <td th:text="${#temporals.format(r.gameDate, 'dd.MM.yyyy HH:mm')}"></td>
                            <td><span class="badge bg-secondary">№<span th:text="${r.tableNumber}"></span></span></td>
                            <td><i class="bi bi-trophy-fill text-warning me-1"></i><span th:text="${r.winnerName}"></span></td>
                            <td class="text-muted" th:text="${r.loserName}"></td>
                        </tr>
                    </tbody>
                </table>
                <p th:if="${recentRecords.isEmpty()}" class="text-muted text-center py-4 mb-0">
                    Нет завершённых игр
                </p>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
