<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Ошибка — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4 bg-light d-flex align-items-center justify-content-center">
        <div class="text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size:4rem"></i>
            <h2 class="mt-3">Ошибка</h2>
            <p class="text-muted" th:text="${errorMessage}">Произошла ошибка</p>
            <a th:href="@{/dashboard}" class="btn btn-warning">
                <i class="bi bi-house me-1"></i>На главную
            </a>
        </div>
    </main>
</div>
</body>
</html>
