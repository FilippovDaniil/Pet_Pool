<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход — Бильярдный клуб</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
        .ball-icon { font-size: 3rem; color: #ffc107; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card login-card p-4" style="width:100%;max-width:400px">
        <div class="text-center mb-4">
            <div class="ball-icon"><i class="bi bi-circle-fill"></i></div>
            <h2 class="fw-bold mt-2">Бильярдный клуб</h2>
            <p class="text-muted">Система управления</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">
            <i class="bi bi-exclamation-triangle me-1"></i>Неверный логин или пароль
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2">
            <i class="bi bi-check-circle me-1"></i>Вы успешно вышли из системы
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Логин</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Введите логин" required autofocus/>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Введите пароль" required/>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Войти
            </button>
        </form>
        <p class="text-muted text-center small mt-3 mb-0">admin / admin &nbsp;|&nbsp; reception / reception</p>
    </div>
</body>
</html>
